<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin | Tueban</title>
  <meta name="description" content="Trang quản trị Tueban" />
  <link rel="stylesheet" href="/assets/app.css" />
  <style>
    .admin-layout { display: grid; grid-template-columns: 220px 1fr; gap: 0; min-height: 100vh; }
    .admin-sidebar { background: var(--panel-2); border-right: 1px solid var(--line); padding: 20px; }
    .admin-sidebar nav { display: grid; gap: 6px; margin-top: 20px; }
    .admin-sidebar nav a { text-decoration: none; padding: 10px 14px; border-radius: 12px; color: var(--muted); }
    .admin-sidebar nav a:hover, .admin-sidebar nav a.active { background: rgba(255,255,255,0.06); color: var(--text); }
    .admin-content { padding: 24px; }
    .admin-table { width: 100%; border-collapse: collapse; }
    .admin-table th, .admin-table td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 14px; }
    .admin-table th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
    .admin-form { display: grid; gap: 12px; max-width: 600px; }
    .admin-form .field-row { display: grid; gap: 4px; }
    .admin-result { margin-top: 12px; }
    .admin-tabs { display: flex; gap: 0; margin-bottom: 20px; border-bottom: 1px solid var(--line); }
    .admin-tabs a { padding: 10px 18px; text-decoration: none; color: var(--muted); border-bottom: 2px solid transparent; }
    .admin-tabs a.active { color: var(--text); border-bottom-color: var(--accent); }
    .admin-section { display: none; }
    .admin-section.active { display: block; }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="site-header" role="banner">
      <div class="header-inner">
        <a class="brand" href="/">
          <span class="brand-mark">T</span>
          <span class="brand-text"><strong>Tueban</strong><small>Admin</small></span>
        </a>
        <div class="header-actions">
          <a class="btn btn-secondary desktop-only" href="/">Về trang chủ</a>
        </div>
      </div>
    </header>

    <main class="admin-layout">
      <aside class="admin-sidebar">
        <p><strong>Admin Panel</strong></p>
        <div id="admin-user-info" class="muted" style="font-size:13px">Đang tải...</div>
        <nav>
          <a href="#" data-tab="courses" class="active">Courses</a>
          <a href="#" data-tab="modules">Modules</a>
          <a href="#" data-tab="topics">Topics</a>
          <a href="#" data-tab="lessons">Lessons</a>
          <a href="#" data-tab="assets">Assets</a>
          <a href="#" data-tab="users">Users</a>
          <a href="#" data-tab="progress">Progress</a>
          <a href="#" data-tab="audit">Audit</a>
          <a href="#" data-tab="ledger">Ledger</a>
          <a href="#" data-tab="events">Events</a>
        </nav>
      </aside>

      <section class="admin-content">
        <div id="admin-message" class="card" style="display:none;margin-bottom:16px"></div>

        <div id="tab-courses" class="admin-section active">
          <h2>Courses</h2>
          <button class="btn" onclick="showCourseForm()">+ New Course</button>
          <div id="courses-list-admin"></div>
          <div id="course-form-area" style="margin-top:16px"></div>
        </div>

        <div id="tab-modules" class="admin-section">
          <h2>Modules</h2>
          <button class="btn" onclick="showModuleForm()">+ New Module</button>
          <div id="modules-list"></div>
          <div id="module-form-area" style="margin-top:16px"></div>
        </div>

        <div id="tab-topics" class="admin-section">
          <h2>Topics</h2>
          <button class="btn" onclick="showTopicForm()">+ New Topic</button>
          <div id="topics-list"></div>
          <div id="topic-form-area" style="margin-top:16px"></div>
        </div>

        <div id="tab-lessons" class="admin-section">
          <h2>Lessons</h2>
          <button class="btn" onclick="showLessonForm()">+ New Lesson</button>
          <div id="lessons-list"></div>
          <div id="lesson-form-area" style="margin-top:16px"></div>
        </div>

        <div id="tab-assets" class="admin-section">
          <h2>Assets</h2>
          <button class="btn" onclick="showAssetForm()">+ Register Asset</button>
          <div id="assets-list"></div>
          <div id="asset-form-area" style="margin-top:16px"></div>
        </div>

        <div id="tab-users" class="admin-section">
          <h2>Users</h2>
          <div id="users-list"></div>
        </div>

        <div id="tab-progress" class="admin-section">
          <h2>Progress</h2>
          <div class="admin-form" style="flex-direction:row;gap:8px">
            <input id="progress-course-filter" class="field-input" placeholder="course_id" />
            <input id="progress-user-filter" class="field-input" placeholder="user_id" />
            <button class="btn" onclick="loadAdminProgress()">Filter</button>
          </div>
          <div id="progress-list"></div>
        </div>

        <div id="tab-audit" class="admin-section">
          <h2>Audit Logs</h2>
          <div id="audit-list"></div>
        </div>

        <div id="tab-ledger" class="admin-section">
          <h2>Ledger</h2>
          <button class="btn" onclick="verifyLedger()">Verify Chain</button>
          <div id="ledger-list" style="margin-top:16px"></div>
          <pre id="ledger-verify-result" class="output" style="margin-top:12px"></pre>
        </div>

        <div id="tab-events" class="admin-section">
          <h2>Events</h2>
          <button class="btn" onclick="showEventForm()">+ New Event</button>
          <div id="events-list"></div>
          <div id="event-form-area" style="margin-top:16px"></div>
        </div>
      </section>
    </main>
  </div>
  <script src="/assets/admin.js"></script>
</body>
</html>
